name: Lean proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check source and witness
        run: |
          python3 ../scripts/check_manifest.py
          python3 ../scripts/check_sources.py
          python3 ../scripts/verify_witness.py
      - name: Resolve pinned dependencies
        run: lake update
      - name: Download dependency cache
        run: lake exe cache get
      - name: Build proof and rerun native computations
        run: lake build
      - name: Audit theorem and axioms
        run: |
          lake env lean Audit.lean | tee axiom-audit.log
          python3 ../scripts/check_sources.py --axiom-log axiom-audit.log
      - name: Check board semantics
        run: lake env lean SemanticAudit.lean
